####################################################################
# kubernetes-manifests/deployments.yaml
# All 11 application deployments
####################################################################

---
# App 1 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-deployment
  namespace: erp-apps
  labels:
    app: app1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1
  template:
    metadata:
      labels:
        app: app1
    spec:
      containers:
      - name: app1-container
        image: 482352877046.dkr.ecr.eu-central-1.amazonaws.com/app1_repo:latest
        ports:
        - containerPort: 80
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: APP_NAME
          value: "app1"
        - name: APP_ENV
          value: "production"

