####################################################################
# kubernetes-manifests/services.yaml
# Services for all 11 applications
####################################################################

---
# App 1 Service
apiVersion: v1
kind: Service
metadata:
  name: app1-service
  namespace: erp-apps
  labels:
    app: app1
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: app1

