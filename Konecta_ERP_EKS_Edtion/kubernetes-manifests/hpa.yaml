####################################################################
# kubernetes-manifests/hpa.yaml
# Horizontal Pod Autoscalers for all 11 applications
# Automatically scales pods based on CPU usage (like ECS Auto Scaling)
####################################################################

---
# App 1 HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: app1-hpa
  namespace: erp-apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: app1-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60

